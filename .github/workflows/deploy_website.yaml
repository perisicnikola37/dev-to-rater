name: Test, Build, Deploy React + Vite App

on:
  push:
    branches:
      - action_workflows

jobs:
  test_build_deploy:
    name: Test, build, deploy
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Cache npm dependencies
      - uses: actions/cache@v2
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/node_modules
          key: ${{ runner.os }}-vite-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-vite-${{ hashFiles('**/package-lock.json') }}-

      # Step 3: Set environment variables (if needed)
      - name: Set environment variables
        run: |
          echo "
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_APP_GA_ID=${{ secrets.VITE_APP_GA_ID }}
            VITE_APP_ENVIRONMENT=${{ secrets.VITE_APP_ENVIRONMENT }}
          " > .env

      # Step 4: Install dependencies and build
      - run: |
          npm install
          npm run build

      # Step 5: SSH into server, pull latest changes, install dependencies and restart project
      - name: SSH into server, pull latest changes, install dependencies and restart project
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Navigating to project directory"
            cd ${{ secrets.PROJECT_PATH }}

            # Ensure proper permissions for project files
            echo "Ensuring correct file permissions..."
            sudo chown -R $USER:$USER ${{ secrets.PROJECT_PATH }}
            sudo chmod -R 755 ${{ secrets.PROJECT_PATH }}

            # Use nvm to install and use Node.js LTS on the server
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"  # Load nvm
            nvm install --lts
            nvm use --lts

            # Verify Node.js version
            echo "Node.js version on server:"
            node -v

            echo "Resetting any local changes"
            git reset --hard HEAD

            echo "Pulling the latest code"
            git pull origin main

            # Kill the process using port 5001 if any (default port for Vite)
            PID=$(lsof -t -i:5001)
            if [ ! -z "$PID" ]; then
              echo "Stopping process on port 5001..."
              kill -9 $PID
            else
              echo "No process is running on port 5001."
            fi

            # Navigate to the frontend analyzer directory
            echo "Navigating to analyzer directory"
            cd analyzer

            # Install dependencies if new ones were added
            echo "Installing dependencies..."
            npm install

            # Build the project if needed
            echo "Building the project..."
            npm run build

            # Start the application again in the background
            echo "Starting the application..."
            nohup npm run preview > app_output.log 2>&1 &

            echo "Deployment complete."

      # Step 6: Clean up SSH key
      - name: Clean up SSH key
        run: rm -f private_key.pem
